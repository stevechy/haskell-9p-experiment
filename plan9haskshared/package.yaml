name:                plan9haskshared
version:             0.1.0.0
github:              "stevechy/plan9haskshared"
license:             BSD-3-Clause
author:              "Steven Cheng Hum Yuen"
maintainer:          "example@example.com"
copyright:           "Copyright (c) 2026 Steven Cheng Hum Yuen"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/stevechy/plan9haskshared#readme>

default-extensions: ImportQualifiedPost

dependencies:
- base >= 4.7 && < 5
- network
- bytestring
- attoparsec
- cereal
- text

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  plan9haskshared-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - plan9haskshared

tests:
  plan9haskshared-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - plan9haskshared
